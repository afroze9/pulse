name: Windows Build and Installer
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Restore frontend
        run: npm ci
      - name: Svelte checks
        run: npm run check
      - name: Frontend regression tests
        run: npm test
      - name: Backend and bridge tests
        run: dotnet run --project tests/Pulse.Backend.Tests
      - name: Validate release version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw 'Tag must match version.json.' }
      - name: Build installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1
      - name: Download previous release for upgrade testing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $releases = gh release list --exclude-drafts --limit 1 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to query previous releases.' }
          if ($releases.Count) {
            gh release download $releases[0].tagName --pattern '*-win-x64-setup.exe' --dir artifacts/previous
            if ($LASTEXITCODE -ne 0) { throw 'Unable to download previous installer.' }
          }
      - name: Test installer lifecycle
        shell: pwsh
        run: |
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).version
          $previous = Get-ChildItem artifacts/previous/*-win-x64-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          $params = @{ Installer = "artifacts/installer/Pulse-$version-win-x64-setup.exe"; Version = $version }
          if ($previous) { $params.PreviousInstaller = $previous.FullName }
          ./scripts/Test-Installer.ps1 @params
      - name: Upload Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pulse-windows-installer
          path: artifacts/installer/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-test-diagnostics
          path: |
            artifacts/installer-test-*/*.json
            artifacts/installer-test-*/*.log
          if-no-files-found: ignore
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pulse-windows-installer
          path: release-assets
      - name: Publish tested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --title "Pulse $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
